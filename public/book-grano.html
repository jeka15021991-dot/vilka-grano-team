<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Вкусная книга GRANO</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap"><style id="css">/* Книга-справочник: одна колонка разделов, у каждого раздела цветная шапка; блюда карточками в 2 колонки, на телефоне в одну */
:root{
  --bg:#f3f2ec; --surface:#fbfaf6; --fg:#22241d; --muted:#5f6355; --line:#d9d7c9; --olive:#6f7340;
  --chip:#e7e5d8; --pasta:#c9952f; --pastafill:#f4e2b0; --warn:#a3261c; --warn-bg:#f6dedb; --on-band:#fff;
  --c0:#55584a; --c11:#2f6f5e; --c12:#3d4a8f; --infobg:#fff3c4; --infoline:#e0a800; --c10:#8a7d2c; --c1:#b78a00; --c2:#3f7d3a; --c3:#127c80; --c4:#c23a2b; --c5:#cf6a12; --c6:#7a1f2e; --c7:#1f5fa8; --c8:#b8457f; --c9:#7a4a1e;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191a15; --surface:#22241d; --fg:#eceadf; --muted:#a9ac9b; --line:#3a3c31; --olive:#b5b976;
  --chip:#33352b; --pasta:#e0b455; --pastafill:#5a4a1e; --warn:#ff9d92; --warn-bg:#4a1f1b; --on-band:#fff;
  --c0:#4a4d40; --c11:#285c4e; --c12:#39457f; --infobg:#3a3214; --infoline:#c99700; --c10:#6f6524; --c1:#8f6c00; --c2:#35692f; --c3:#0f686b; --c4:#a83023; --c5:#a9560d; --c6:#7a1f2e; --c7:#1f5596; --c8:#9a3a6a; --c9:#6b4119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191a15; --surface:#22241d; --fg:#eceadf; --muted:#a9ac9b; --line:#3a3c31; --olive:#b5b976;
  --chip:#33352b; --pasta:#e0b455; --pastafill:#5a4a1e; --warn:#ff9d92; --warn-bg:#4a1f1b; --on-band:#fff;
  --c0:#4a4d40; --c11:#285c4e; --c12:#39457f; --infobg:#3a3214; --infoline:#c99700; --c10:#6f6524; --c1:#8f6c00; --c2:#35692f; --c3:#0f686b; --c4:#a83023; --c5:#a9560d; --c6:#7a1f2e; --c7:#1f5596; --c8:#9a3a6a; --c9:#6b4119; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3,h4,p{margin:0}
.c0{--sc:var(--c0)}.c10{--sc:var(--c10)}.c1{--sc:var(--c1)}.c2{--sc:var(--c2)}.c3{--sc:var(--c3)}.c4{--sc:var(--c4)}.c5{--sc:var(--c5)}
.c6{--sc:var(--c6)}.c7{--sc:var(--c7)}.c8{--sc:var(--c8)}.c9{--sc:var(--c9)}

.top{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);font-weight:600}
h1{font-family:var(--display);font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.05;font-weight:700}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.facts div{background:var(--surface);padding:14px 16px;font-size:.95rem;color:var(--muted);min-width:0}
.facts b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--fg);margin-bottom:4px}
.how{display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.warn{color:var(--warn);background:var(--warn-bg);padding:10px 14px;font-weight:500}
.leg{display:flex;flex-wrap:wrap;gap:6px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.nav a{flex:none;background:var(--sc);color:var(--on-band);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:3px}
.nav a:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.search{display:flex;flex-direction:column;gap:6px}
.search label{font-size:.85rem;font-weight:600;color:var(--muted)}
.search input{font:inherit;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:3px;width:100%;box-sizing:border-box}
#cnt{font-size:.85rem;color:var(--muted);min-height:1.2em}

.sec{display:flex;flex-direction:column;gap:18px;scroll-margin-top:64px}
.band{background:var(--sc);color:var(--on-band);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.band h2{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-weight:700}
.band p{font-size:.95rem;opacity:.95}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:2px solid var(--sc);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:stretch}
.grid .dish{break-inside:avoid}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 24px}
.dish{min-width:0;display:flex;flex-direction:column;gap:6px}
.grid .dish{background:var(--surface);border-top:4px solid var(--sc);padding:12px 14px 14px}
.list .dish{border-bottom:1px solid var(--line);padding-block:9px}
.dish header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dish h4{font-size:1.05rem;font-weight:600;line-height:1.25;min-width:0}
.dish h4 small{font-weight:400;color:var(--muted);font-size:.85rem;white-space:nowrap}
.pr{flex:none;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.list .pr{white-space:normal;text-align:right;max-width:55%}
.comp{font-size:.92rem;color:var(--muted)}
.comp b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.al i,.fl i{font-style:normal;margin-right:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.al,.fl{font-size:.8rem;padding:3px 8px;border-radius:2px;background:var(--chip);color:var(--fg);white-space:nowrap}
.fl{background:var(--warn-bg);color:var(--warn);font-weight:600}
.say{font-size:1rem}.off{font-size:.92rem;background:var(--chip);padding:6px 10px}
.off b{display:inline;margin-right:6px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);font-weight:600}
.off b{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .say b{color:var(--olive)}}
:root[data-theme="dark"] .say b{color:var(--olive)}
.foot{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.nav a{opacity:.72}.nav a.on,.wrap:not(.tabs) .nav a,.wrap.found .nav a{opacity:1}
.nav a.on{box-shadow:inset 0 -4px 0 var(--fg)}
.lede{font-size:1rem;max-width:70ch}
.todo{background:var(--warn-bg);color:var(--warn);padding:1px 6px;font-weight:600}
.news{background:var(--surface);border:1px solid var(--line);padding:12px 16px;font-size:.95rem}
.news ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.news span{font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
.pick{background:var(--surface);border-top:4px solid var(--sc);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pick h4{font-size:1.05rem}
.doneness{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.done{display:flex;flex-direction:column;gap:6px;min-width:0}
.done h4{font-size:1rem}.done h4 small{font-weight:400;color:var(--muted);font-size:.8rem}
.cut{height:54px;background:#5a3a2c;border-radius:27px;padding:7px;display:flex}
.cut span{flex:1;border-radius:20px;background:var(--m)}
.list .dish header+.say,.list .dish>.say{font-size:.98rem}
.ph{display:block;width:calc(100% + 28px);max-width:none;margin:-12px -14px 4px;aspect-ratio:3/2;object-fit:cover;background:var(--chip)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:stretch}
.herotxt{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.hero>.ph{width:100%;margin:0;aspect-ratio:auto;height:100%;min-height:220px;max-height:340px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero>.ph{order:-1;max-height:200px;min-height:0;aspect-ratio:16/9}}
@media print{
  :root{--bg:#fff;--surface:#faf9f4}
  body{font-size:9pt;line-height:1.35}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .search,.news{display:none!important}
  .nav{position:static;flex-wrap:wrap;border:0;padding:0}
  .nav a{opacity:1!important;box-shadow:none!important;font-size:8.5pt;padding:5px 9px}
  .sec[hidden],.grp[hidden],.dish[hidden]{display:flex!important}
  .dish[hidden]{display:flex!important}
  .wrap{max-width:none;padding:0;gap:12px}
  .sec{break-before:page;gap:10px}
  #grano{break-before:auto}
  .done,.pick,.band,.list .dish{break-inside:avoid}
  .grp h3{break-after:avoid}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid .dish{padding:8px 9px 9px;gap:4px;border:1px solid var(--line);border-top:4px solid var(--sc)}
  .ph{width:calc(100% + 18px);margin:-8px -9px 3px}
  .hero>.ph{width:100%;margin:0;max-height:250px}
  .list{grid-template-columns:1fr 1fr 1fr;gap:0 14px}
  .list .dish{padding-block:5px}
  .dish h4{font-size:10pt}.say{font-size:9pt}.comp{font-size:8.3pt}.al,.fl{font-size:7.3pt;padding:1px 5px}.off{font-size:8.3pt;padding:4px 7px}
  .band{padding:9px 12px}.band h2{font-size:19pt}
  h1{font-size:34pt}
  .doneness{grid-template-columns:repeat(5,1fr)}
}
.c11{--sc:var(--c11)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.bar .nav{position:static;border:0;padding-block:0 8px}
.bar .search label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.bar .search input{border:2px solid var(--olive);font-size:1rem}
#cnt:empty{display:none}
.sec{scroll-margin-top:120px}
.tell{background:var(--surface);border-left:6px solid var(--sc);padding:10px 14px;font-size:1rem}
.tell b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.done.rec .cut{outline:3px solid var(--olive);outline-offset:2px}
.recm{font-size:.75rem;font-weight:600;color:var(--olive);text-transform:uppercase;letter-spacing:.06em}
.hero .leg{margin-top:2px}
.ed{font:inherit;font-size:.85rem;font-weight:600;align-self:flex-start;padding:6px 12px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:3px;cursor:pointer}
.ed.add{border-style:dashed}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:.9rem}
.editbar span{margin-right:auto}
.editbar button,.form button{font:inherit;font-weight:600;padding:9px 14px;border-radius:3px;border:1px solid var(--bg);background:var(--bg);color:var(--fg);cursor:pointer}
.editbar button:disabled{opacity:.45;cursor:default}
.wrap:has(.editbar){padding-bottom:90px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.form{background:var(--bg);color:var(--fg);width:min(100%,560px);padding:18px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.form h3{font-family:var(--display);font-size:1.4rem;margin:0 0 4px}
.form label{font-weight:600;font-size:.82rem;color:var(--muted);margin-top:6px}
.form input[type=text],.form textarea,.form select{font:inherit;padding:9px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:3px;width:100%;box-sizing:border-box}
.form fieldset{border:1px solid var(--line);padding:8px 10px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.form legend{font-weight:600;font-size:.82rem;color:var(--muted)}
.form .ck{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--fg);font-size:.92rem;margin:0}
.fbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.form button{border-color:var(--fg)}.form button[type=submit]{background:var(--fg);color:var(--bg)}
.form .danger{color:var(--warn);border-color:var(--warn)}
.fmsg{color:var(--warn);font-size:.9rem;min-height:1.2em}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
@media print{
  .bar,.editbar,.ed{display:none!important}
  .sec,.grp,.wrap{display:block}
  .sec{break-before:auto;margin-top:14px}
  .sec[hidden],.grp[hidden]{display:block!important}
  .band,.tell,.grp h3,.lede{break-after:avoid;margin-bottom:8px}
  .grp{margin-bottom:10px}
  .doneness,.pick{break-inside:avoid;margin-bottom:8px}
  .top{margin-bottom:12px}
  .tell{break-inside:avoid;font-size:9pt;padding:6px 10px}
  .wrap{padding-bottom:0!important}

}

.pic{display:block;width:120px;max-width:100%;height:60px}

@media print{.doneness{grid-template-columns:repeat(3,1fr)}}

}

.infobox{background:var(--infobg);border:2px solid var(--infoline);padding:14px 16px 16px}
