<title>Вкусная книга VILKA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: a coal-black VILKA cover, then one column of menu sections; each section opens with a full colour band and lays its dishes out as photo cards (2–3 per row, 1 on a phone). Palette: coal and steak-crust ember with bold section colours. */
:root{
  --bg:#f4ede5; --surface:#fffdf9; --surface-2:#efe4d7; --line:#e0d2c1;
  --fg:#1d1611; --muted:#6a5b4b; --coal:#1d1611; --on-coal:#f6ece0; --ember:#e0731f; --on-band:#fff;
  --display:"Unbounded","Arial Black",Arial,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --c-vilka:#1d1611; --c-service:#3a2b20; --c-done:#8e2430;
  --c-steak:#9b2a1f; --c-bird:#c4860c; --c-fish:#126f83; --c-burger:#e0621a; --c-salad:#4f8a2b;
  --c-soup:#b3471f; --c-side:#8c7414; --c-beer:#c7900a; --c-sauce:#c0302c; --c-dessert:#b13a74;
  --c-bar:#6a3fa0; --c-cold:#0f8a7d; --c-coffee:#6f4524; --c-tea:#5d8a1f; --c-gloss:#3a2b20; --c-pivo:#a8650a;
  --new:#2f7d24; --hot:#c0302c; --nut:#8a5a1c; --alc:#6a3fa0; --hos:#c9600f; --tbd:#7a6b58;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100c; --surface:#211913; --surface-2:#2b2119; --line:#3d2f24;
  --fg:#f3e9dc; --muted:#b4a28d; --coal:#0d0907; --on-coal:#f6ece0; --ember:#f08b36;
  --c-vilka:#0d0907; --c-service:#2f241b; --c-done:#7d1f2a;
  --c-steak:#8a2419; --c-bird:#a2700a; --c-fish:#0f5f70; --c-burger:#c25414; --c-salad:#437624;
  --c-soup:#9a3d1a; --c-side:#76610f; --c-beer:#a57708; --c-sauce:#a62925; --c-dessert:#983263;
  --c-bar:#5a358a; --c-cold:#0c7469; --c-coffee:#5f3b1f; --c-tea:#4f7619; --c-gloss:#2f241b; --c-pivo:#8a5408;
  --new:#8fd27c; --hot:#ff8a7a; --nut:#e0b27a; --alc:#c3a2ee; --hos:#f5a05a; --tbd:#a8987f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100c; --surface:#211913; --surface-2:#2b2119; --line:#3d2f24;
  --fg:#f3e9dc; --muted:#b4a28d; --coal:#0d0907; --on-coal:#f6ece0; --ember:#f08b36;
  --c-vilka:#0d0907; --c-service:#2f241b; --c-done:#7d1f2a;
  --c-steak:#8a2419; --c-bird:#a2700a; --c-fish:#0f5f70; --c-burger:#c25414; --c-salad:#437624;
  --c-soup:#9a3d1a; --c-side:#76610f; --c-beer:#a57708; --c-sauce:#a62925; --c-dessert:#983263;
  --c-bar:#5a358a; --c-cold:#0c7469; --c-coffee:#5f3b1f; --c-tea:#4f7619; --c-gloss:#2f241b; --c-pivo:#8a5408;
  --new:#8fd27c; --hot:#ff8a7a; --nut:#e0b27a; --alc:#c3a2ee; --hos:#f5a05a; --tbd:#a8987f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.c-vilka{--sc:var(--c-vilka)}.c-service{--sc:var(--c-service)}.c-done{--sc:var(--c-done)}.c-steak{--sc:var(--c-steak)}.c-bird{--sc:var(--c-bird)}
.c-fish{--sc:var(--c-fish)}.c-burger{--sc:var(--c-burger)}.c-salad{--sc:var(--c-salad)}.c-soup{--sc:var(--c-soup)}.c-side{--sc:var(--c-side)}
.c-beer{--sc:var(--c-beer)}.c-sauce{--sc:var(--c-sauce)}.c-dessert{--sc:var(--c-dessert)}.c-bar{--sc:var(--c-bar)}.c-cold{--sc:var(--c-cold)}
.c-coffee{--sc:var(--c-coffee)}.c-pivo{--sc:var(--c-pivo)}.c-tea{--sc:var(--c-tea)}.c-gloss{--sc:var(--c-gloss)}

/* cover */
.cover{background:var(--coal);color:var(--on-coal);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cover-txt{padding:30px 28px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(46px,10vw,84px);line-height:.9;letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--ember)}
.tag{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.32em;text-transform:uppercase;opacity:.8}
.cover h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,28px);color:var(--ember)}
.cover p{opacity:.85;max-width:44ch}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;min-height:260px}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic img:first-child{grid-row:1/3}
@media (max-width:720px){.cover{grid-template-columns:1fr}.mosaic{order:-1;min-height:200px}}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* nav + search */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:10px 14px}
.search input::placeholder{color:var(--muted)}
.search button{font:inherit;font-weight:600;color:var(--fg);background:var(--surface-2);border:0;border-radius:6px;padding:0 14px;cursor:pointer}
.nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;background:var(--sc);color:var(--on-band);text-decoration:none;font-weight:600;font-size:13px;padding:7px 11px;border-radius:4px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.empty{color:var(--muted);text-align:center;padding:20px 0}

/* sections */
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:120px}
.band{background:var(--sc);color:var(--on-band);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.band h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,32px);line-height:1.1;position:relative}
.band p{font-size:15px;opacity:.92;max-width:70ch;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.dish{background:var(--surface);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0;border-bottom:4px solid var(--sc)}
.ph{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.ill{aspect-ratio:5/2;display:grid;place-items:center;background:var(--sc);color:var(--on-band);position:relative}
.ill::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 12px,transparent 12px 24px)}
.ill svg{width:26%;height:auto;position:relative;opacity:.9}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.dish h3{font-size:19px;font-weight:700;line-height:1.2}
.desc{font-size:15.5px}
.comp{font-size:14.5px;color:var(--muted)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sc);margin-bottom:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:12px;font-weight:600;border-radius:4px;padding:3px 8px;line-height:1.3;white-space:nowrap;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.b-new{--k:var(--new)}.b-hot{--k:var(--hot)}.b-nut{--k:var(--nut)}.b-alc{--k:var(--alc)}.b-hos{--k:var(--hos)}.b-tbd{--k:var(--tbd)}
.sauces{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.sc{padding:12px 14px;gap:4px;border-bottom:0;border-left:5px solid var(--sc)}
.sc b{font-size:17px}
.sc p{font-size:14.5px;color:var(--muted)}
.rules{background:var(--surface);border-left:5px solid var(--sc);border-radius:6px;padding:14px 16px;font-size:15px}
.rules b{font-weight:700}
.rules ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* info sections */
.feat,.pillars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.feat div,.pillars div{background:var(--surface);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:4px solid var(--ember)}
.feat b,.pillars b{font-size:17px;font-weight:700}
.feat p,.pillars p{font-size:15px;color:var(--muted)}
.num{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--ember)}
.rec{background:var(--surface);border-radius:6px;padding:16px;border-left:5px solid var(--sc)}
.doneness{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px}
.dn{background:var(--surface);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px}
.dn.star{outline:3px solid var(--ember)}
.dn h3{font-size:17px}
.dn h3 em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ember)}
.dn p{font-size:14.5px;color:var(--muted)}
.cut{height:52px;background:#5a3424;border-radius:26px;padding:7px;display:flex}
.cut span{flex:1;border-radius:20px;background:var(--m)}
.gloss{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.gloss div{background:var(--surface);border-radius:6px;padding:12px 14px}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted);font-size:14.5px}
.beerinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.beerinfo div{background:var(--surface);border-radius:6px;padding:14px 16px;border-top:4px solid var(--sc);display:flex;flex-direction:column;gap:4px}
.beerinfo b{font-size:16px}.beerinfo p{font-size:14.5px;color:var(--muted)}
.sub{font-family:var(--display);font-weight:700;font-size:20px;color:var(--sc)}
.beer .style{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sc)}
.beer .who{font-size:14.5px;background:var(--surface-2);border-radius:4px;padding:8px 10px}
.hint{overflow-x:auto}
.hint table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:6px;overflow:hidden;font-size:15px}
.hint th{background:var(--sc);color:var(--on-band);text-align:left;padding:10px 14px;font-weight:600}
.hint td{padding:9px 14px;border-top:1px solid var(--line)}
.chef{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,.75fr);gap:20px;padding:18px;align-items:center;background:var(--coal);color:var(--on-coal);border-bottom:4px solid var(--sc)}
.chef h3{font-family:var(--display);font-size:clamp(24px,4vw,34px);font-weight:700}
.chef-txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.chef .lbl{color:var(--ember)}
.chef .comp{color:color-mix(in srgb,var(--on-coal) 75%,transparent)}
.layers{position:relative;margin:0;min-width:0}
.layers img{display:block;width:50%;height:auto}
.layers ol{list-style:none;margin:0;padding:0}
.layers li{position:absolute;left:46%;right:0;transform:translateY(-50%);font-size:13px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:6px}
.layers li::before{content:"";flex:none;width:22px;height:2px;background:var(--ember)}
.chef-vid{width:100%;max-width:280px;justify-self:center;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#000}
@media (max-width:820px){.chef{grid-template-columns:1fr}.chef-vid{max-width:240px}.layers img{width:44%}.layers li{left:41%;font-size:11.5px;white-space:nowrap}.layers li::before{width:14px}}
.sides{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:stretch}
.sides-ph{position:relative;min-height:300px}.sides-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px}
.sides-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sd{padding:12px 16px;gap:3px;border-bottom:0;border-left:5px solid var(--sc)}
.sd b{font-size:17px}.sd span{font-size:14.5px;color:var(--muted)}
@media (max-width:640px){.sides{grid-template-columns:1fr}.sides-ph{height:300px}}
.part{background:var(--coal);color:var(--on-coal);border-radius:6px;padding:26px 22px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:120px;margin-top:10px}
.part span{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ember)}
.part h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,56px);line-height:1}
.part p{opacity:.85}
.navlbl{flex:none;align-self:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 8px}
.cutph{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;display:block}
.muted{color:var(--muted)}
.sign{background:var(--coal);color:var(--on-coal);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.sign .who{font-weight:700;font-size:17px}
.sign .tel{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ember);font-variant-numeric:tabular-nums;user-select:all}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media print{.bar{display:none}.dish,.dn,.feat div,.pillars div,.sc{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<div id="host"></div><script>(function(){var d=(window.parent&&window.parent.__BOOK)||{html:""};var x=document.getElementById("host");x.insertAdjacentHTML("afterend",d.html);x.remove();})();</script><script>
(function(){
  var q=document.getElementById("q"),clr=document.getElementById("clear"),empty=document.getElementById("empty");
  var info=[].slice.call(document.querySelectorAll("section.info,aside.rules,.aux,.part"));
  var secs=[].slice.call(document.querySelectorAll("section.menu"));
  function run(){
    var v=q.value.trim().toLowerCase().replace(/ё/g,"е"),any=false;
    clr.hidden=!v;
    info.forEach(function(s){s.hidden=!!v});
    secs.forEach(function(s){
      var hit=0;
      s.querySelectorAll(".dish").forEach(function(d){
        var ok=!v||d.getAttribute("data-s").replace(/ё/g,"е").indexOf(v)>-1;
        d.hidden=!ok;if(ok)hit++;
      });
      s.hidden=!!v&&!hit;if(hit)any=true;
    });
    empty.hidden=!v||any;
  }
  q.addEventListener("input",run);
  clr.addEventListener("click",function(){q.value="";run();q.focus()});
  document.querySelectorAll(".nav a").forEach(function(a){a.addEventListener("click",function(){if(q.value){q.value="";run()}})});
})();
</script>
