name: Публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Версия файлов (сброс кэша у сотрудников)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$V'#" public/*.js
          sed -i -E "s#(href=\"app\.css|src=\"app\.js)\"#\1?v=$V\"#" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
